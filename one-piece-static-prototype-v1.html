function setup(){nav.forEach(([id,n])=>document.getElementById('nav').insertAdjacentHTML('beforeend',`<button data-id="${id}" onclick="go('${id}')">${n}</button>`));Object.entries(data).forEach(([id,v])=>document.getElementById('main').insertAdjacentHTML('beforeend',`<section class="page" id="${id}"><div class="head"><div><div class="label">ONE PIECE / FINANCE</div><h1>${v[0]}</h1><div class="desc">${v[1]}</div></div></div>${v[2]}</section>`));go(location.hash.slice(1)||'dashboard')}
function go(id){if(!data[id])id='dashboard';document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));history.replaceState(null,'','#'+id);scrollTo(0,0)}function toggleNav(){document.querySelector('aside').style.display=document.querySelector('aside').style.display==='block'?'none':'block'}setup();
</script></body></html>
