name: Deploy to Firebase Hosting on PR
on:
  workflow_run:
    workflows: ["Unit Tests"] 
    types:
      - completed
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    name: Build and Deploy to Firebase Hosting Preview Channel
    if: >
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying to Firebase Hosting preview channel for PR #${{ github.event.workflow_run.pull_requests[0].number }}"
      - run: echo "Branch ${{ github.event.workflow_run.head_branch }}"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile && pnpm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONE_PIECE_4E822 }}
          projectId: one-piece-4e822
          channelId: dev
