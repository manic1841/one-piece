services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # command: pnpm dev --host 0.0.0.0
    command: tail -f /dev/null
    depends_on:
      firebase:
        condition: service_healthy
    environment:
      # inotify 充足（max_user_watches=1048576），不需輪詢，避免背景燒 CPU
      CHOKIDAR_USEPOLLING: 'false'
      # 固定共用同一份 pnpm store（絕對路徑），讓 repo 與所有 worktree 都能 hardlink
      npm_config_store_dir: /workspace/one-piece/.pnpm-store
      FIREBASE_AUTH_EMULATOR_HOST: http://firebase:9099
      FIREBASE_PROJECT_ID: demo-project
      FIRESTORE_EMULATOR_HOST: firebase:8080
      VITE_FIREBASE_API_KEY: fake-api-key
      VITE_FIREBASE_AUTH_DOMAIN: fake.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-project
      VITE_FIRESTORE_EMULATOR: 'true'
    init: true
    ports:
      - '${VITE_PORT:-5173}:5173'
    volumes:
      # host 上 repo 的父目錄 → VS Code 建的 worktree sibling 落在此，
      # 與 pnpm store 同檔案系統（可 hardlink）、且持久不隨容器重建消失。
      # repo 本身會以 host 資料夾名出現在 /workspace/one-piece；
      # 不再額外掛 .:/workspace/main，避免同一份被掛成兩個路徑。
      - ..:/workspace

  firebase:
    build:
      context: ./firebase-emulator
      dockerfile: Dockerfile
    environment:
      FIREBASE_PROJECT_ID: demo-project
    stop_grace_period: 30s
    expose:
      - '4000'
      - '8080'
      - '9099'
    ports:
      - '4000:4000'
      - '8080:8080'
      - '9099:9099'
    volumes:
      - firebase_data:/firebase

volumes:
  firebase_data:
